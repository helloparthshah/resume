name: Build resume

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile resume with XeLaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          working_directory: resume
          latexmk_use_xelatex: true

      - uses: actions/upload-artifact@v4
        with:
          name: resume
          path: resume/resume.pdf

      # The website serves https://github.com/helloparthshah/resume/releases/latest/download/resume.pdf
      - name: Publish to the "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --title "Latest resume" --notes "Built automatically from main." --latest
          fi
          gh release upload latest resume/resume.pdf --clobber
